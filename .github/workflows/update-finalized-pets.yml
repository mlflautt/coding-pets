name: Update finalized pets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pets/**/pet.json"
      - "pets/**/preview.json"
      - "pets/**/spritesheet.webp"

permissions:
  contents: write

concurrency:
  group: update-finalized-pets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/update_finalized_pets.py
      - run: python scripts/validate_catalog.py
      - name: Commit derived publication updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Finalized pet surfaces are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog.json pets/*/preview.png pets/*/provenance.json
          git commit -m "Update finalized pet catalogue"
          git push
