name: Validate pet catalogue

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Verify finalized-pet derived updates
        run: python scripts/update_finalized_pets.py --check
      - run: python scripts/validate_catalog.py
      - name: Verify reproducible public previews
        shell: bash
        run: |
          while IFS= read -r -d '' config; do
            python scripts/generate_public_preview.py "$config" --check
          done < <(find pets -name preview.json -print0)
